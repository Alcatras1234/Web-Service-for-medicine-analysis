spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://backend_db:5432/back_DB
    username: amogus
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        prefetch: 32

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  # Spring Cache: пока используем in-memory (concurrent map) — стабильнее на старте.
  # Redis для кеша оставлен в инфре, но не используется — Jackson typing с разнотиповыми
  # Map<String,Object> и записями SlideInfo не помещается в одну конфигурацию сериализатора.
  # Если нужен распределённый кеш — поменять на `redis` и доводить CacheConfig.
  cache:
    type: simple

  # Multipart парсер не используется (стримим сырой PUT в /api/files/proxy-upload).
  # Но дефолтные лимиты применяются и к multipart-, и к простым large-body запросам,
  # поэтому явно разрешаем большие тела.
  servlet:
    multipart:
      enabled: false
      max-file-size: -1
      max-request-size: -1

minio:
  access-key: minioadmin
  secret-key: minioadmin
  bucketName: wsi-bucket
  # url — для presigned URL'ов которые отдаются в браузер. Должен быть тот адрес,
  # по которому браузер видит MinIO. На сервере — публичный IP, локально — localhost.
  url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  # internalUrl — для backend↔minio внутри docker compose сети.
  internalUrl: http://minio:9000

server:
  port: 8080
  tomcat:
    # большой WSI (1-3 GB) может литься минутами — Tomcat не должен резать тело
    max-swallow-size: -1
    max-http-form-post-size: -1
    connection-timeout: 30m

logging:
  level:
    com.e.demo: DEBUG

jwt:
  secret: "my-super-secret-key-at-least-256-bits-long-for-hs256"
  expiration-ms: 86400000  # 24 часа


inference:
  url: http://inference:8500

# E4: локальный кэш скачанных WSI для tile-сервиса. На него ходит BioFormats.
wsi:
  cache-dir: /tmp/wsi-cache