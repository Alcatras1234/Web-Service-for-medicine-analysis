# Все контейнеры этого проекта именованы с префиксом eosinai-* и помещены
# в одну сеть eosinai-net. Project name задаётся через COMPOSE_PROJECT_NAME=eosinai
# (см. .env рядом). На прод-сервере все хост-порты со сдвигом +10000,
# чтобы не конфликтовать с уже занятыми портами.

networks:
  eosinai-net:
    driver: bridge
    name: eosinai-net

volumes:
  eosinai-postgres-data:
  eosinai-minio-data:
  eosinai-wsi-cache:

services:

  eosinai-postgres:
    image: postgres:15
    container_name: eosinai-postgres
    hostname: backend_db
    environment:
      POSTGRES_DB: "back_DB"
      POSTGRES_USER: "amogus"
      POSTGRES_PASSWORD: "1234"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - eosinai-postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    networks:
      - eosinai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amogus -d back_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

  eosinai-minio:
    image: minio/minio
    container_name: eosinai-minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"    # S3 API
      - "19001:9001"    # Web UI
    networks:
      - eosinai-net
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - eosinai-minio-data:/data
    restart: unless-stopped

  eosinai-rabbitmq:
    image: rabbitmq:3-management
    container_name: eosinai-rabbitmq
    hostname: rabbitmq
    ports:
      - "15672:5672"    # AMQP
      - "25672:15672"   # Management UI (http://188.126.62.18:25672, guest/guest)
    networks:
      - eosinai-net
    restart: unless-stopped

  eosinai-redis:
    image: redis:7-alpine
    container_name: eosinai-redis
    hostname: redis
    ports:
      - "16379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - eosinai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  eosinai-liquibase:
    image: liquibase/liquibase:4.29
    container_name: eosinai-liquibase
    depends_on:
      - eosinai-postgres
    command:
      - --searchPath=/changesets
      - --changelog-file=master.yaml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://backend_db:5432/back_DB
      - --username=amogus
      - --password=1234
      - update
    volumes:
      - ./db/init.sql:/changesets/init.sql
      - ./db/master.yaml:/changesets/master.yaml
    networks:
      - eosinai-net

  # Inference-сервис: gRPC-клиент удалённого Triton.
  # Локального Triton-контейнера в стеке больше нет — он крутится отдельно на хосте
  # (188.126.62.18:18001) под другим compose-проектом.
  eosinai-inference:
    build:
      context: ./inference-service
      dockerfile: Dockerfile
    container_name: eosinai-inference
    hostname: inference
    ports:
      - "18500:8500"
    networks:
      - eosinai-net
    environment:
      - TRITON_URL=188.126.62.18:18001
      - TRITON_MODEL_NAME=eosinophil_seg
      - TRITON_INPUT_NAME=images
      - TRITON_TIMEOUT_S=60
      - CONF_THRESH=0.25
      - IOU_THRESH=0.45
      - INPUT_SIZE=448
      - NUM_CLASSES=2
      - USE_CC_COUNT=false
    restart: unless-stopped

  eosinai-server:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: eosinai-server
    hostname: server
    ports:
      - "18080:8080"
    depends_on:
      - eosinai-postgres
      - eosinai-rabbitmq
      - eosinai-minio
      - eosinai-redis
      - eosinai-inference
    networks:
      - eosinai-net
    volumes:
      - eosinai-wsi-cache:/tmp/wsi-cache
    environment:
      # Браузер фронта (на удалённом сервере) бьёт по публичному IP с портом MinIO,
      # если когда-то понадобятся пресайны. Сейчас не используется — фронт идёт
      # через Spring (/api/files/proxy-upload).
      - MINIO_PUBLIC_URL=http://188.126.62.18:19000
    restart: unless-stopped

  # Next.js фронт. Внешний доступ: http://188.126.62.18:13000
  eosinai-frontend:
    build:
      context: ../frontend/my-app
      dockerfile: Dockerfile
    container_name: eosinai-frontend
    hostname: frontend
    ports:
      - "27:3000"
    depends_on:
      - eosinai-server
    networks:
      - eosinai-net
    environment:
      - NODE_ENV=production
      # Внутри docker-сети Spring доступен по имени контейнера server.
      - BACKEND_URL=http://server:8080
    restart: unless-stopped
