# Все контейнеры этого проекта именованы с префиксом eosinai-* и помещены
# в одну сеть eosinai-net. Project name задаётся через COMPOSE_PROJECT_NAME=eosinai
# (см. .env рядом) — это значит:
#   docker compose up -d        ← поднимает только наши контейнеры
#   docker compose down         ← гасит только наши, чужие на сервере не трогает
#   docker compose ps           ← показывает только наши
# Не используй "docker stop $(docker ps -q)" — снесёт ВСЕ контейнеры на сервере.

networks:
  eosinai-net:
    driver: bridge
    name: eosinai-net

volumes:
  eosinai-postgres-data:
  # eosinai-pgadmin-data:    # pgAdmin отключён
  eosinai-minio-data:
  eosinai-wsi-cache:
  # eosinai-triton-models:   # модели лежат внутри Triton-образа, volume не нужен

services:

  eosinai-postgres:
    image: postgres:15
    container_name: eosinai-postgres
    hostname: backend_db          # ← старое имя оставлено, иначе придётся править application.yaml
    environment:
      POSTGRES_DB: "back_DB"
      POSTGRES_USER: "amogus"
      POSTGRES_PASSWORD: "1234"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - eosinai-postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      # Хост-порт смещён на +10000 чтобы не конфликтовать с системным postgres'ом на сервере.
      # Внутри docker-сети backend всё равно ходит на 5432 (см. application.yaml).
      - "15432:5432"
    networks:
      - eosinai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amogus -d back_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

  # pgAdmin отключён — не нужен в проде. При необходимости расскомментировать.
  # eosinai-pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: eosinai-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "15050:80"
  #   depends_on:
  #     - eosinai-postgres
  #   volumes:
  #     - eosinai-pgadmin-data:/var/lib/pgadmin
  #   networks:
  #     - eosinai-net
  #   restart: unless-stopped

  eosinai-minio:
    image: minio/minio
    container_name: eosinai-minio
    hostname: minio              # ← алиас, чтобы application.yaml не править
    command: server /data --console-address ":9001"
    ports:
      # Левая часть — порт на хосте, правая — внутри контейнера.
      # Меняем хост-порт чтобы не было конфликта с другим minio/nginx на сервере.
      - "19000:9000"
      - "19001:9001"
    networks:
      - eosinai-net
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - eosinai-minio-data:/data
    restart: unless-stopped

  eosinai-rabbitmq:
    image: rabbitmq:3-management
    container_name: eosinai-rabbitmq
    hostname: rabbitmq           # ← алиас
    ports:
      - "15672:5672"     # AMQP
      - "25672:15672"    # Management UI
    networks:
      - eosinai-net
    restart: unless-stopped

  eosinai-redis:
    image: redis:7-alpine
    container_name: eosinai-redis
    hostname: redis              # ← алиас
    ports:
      - "16379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - eosinai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  eosinai-liquibase:
    image: liquibase/liquibase:4.29
    container_name: eosinai-liquibase
    depends_on:
      - eosinai-postgres
    command:
      - --searchPath=/changesets
      - --changelog-file=master.yaml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://backend_db:5432/back_DB
      - --username=amogus
      - --password=1234
      - update
    volumes:
      - ./db/init.sql:/changesets/init.sql
      - ./db/master.yaml:/changesets/master.yaml
    networks:
      - eosinai-net

  # Triton Inference Server — модель крутится прямо в нашем стеке
  # Dockerfile лежит в /home/dbz/triton_eosinophil/ на сервере
  eosinai-triton:
    build:
      context: /home/dbz/triton_eosinophil
      dockerfile: Dockerfile
    container_name: eosinai-triton
    hostname: triton
    # Порты НЕ публикуем наружу — Triton доступен только из docker-сети eosinai-net
    # через имена triton:8000 (HTTP) и triton:8001 (gRPC).
    networks:
      - eosinai-net
    # Модели лежат на хосте отдельной папкой (read-only монтирование).
    # Внутри ожидаются папки eosinophil_pipeline (ensemble), eosinophil_preprocess,
    # eosinophil_seg, eosinophil_postprocess.
    volumes:
      - /home/dbz/triton_eosinophil/models:/models:ro
    # Базовый образ tritonserver:24.09-py3 имеет дефолтный ENTRYPOINT=tritonserver,
    # но без явного --model-repository выходит сразу. Указываем явно.
    command: >
      tritonserver
      --model-repository=/models
      --strict-model-config=false
      --log-verbose=1
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  eosinai-inference:
    build:
      context: ./inference-service
      dockerfile: Dockerfile
    container_name: eosinai-inference
    hostname: inference
    ports:
      - "8500:8500"
    networks:
      - eosinai-net
    depends_on:
      - eosinai-triton
    # Препроцессинг + NMS/маски/CC + прокси на Triton через gRPC.
    # Triton теперь в той же сети — обращаемся по имени, не по IP.
    environment:
      - TRITON_URL=triton:8001
      - TRITON_MODEL_NAME=eosinophil_pipeline
      - TRITON_TIMEOUT_S=60
      - CONF_THRESH=0.25
      - IOU_THRESH=0.45
      - INPUT_SIZE=448
      - NUM_CLASSES=2
      - COORD_SCALE_FACTOR=1.0
    restart: unless-stopped

  eosinai-server:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: eosinai-server
    hostname: server
    # Наружу НЕ публикуем — фронт ходит к нам по docker-сети по имени server:8080.
    # Если нужен прямой доступ к API для отладки — добавь ports: ["18080:8080"].
    expose:
      - "8080"
    depends_on:
      - eosinai-postgres
      - eosinai-rabbitmq
      - eosinai-minio
      - eosinai-redis
      - eosinai-inference
    networks:
      - eosinai-net
    volumes:
      - eosinai-wsi-cache:/tmp/wsi-cache
    environment:
      # MINIO_PUBLIC_URL больше не используется браузером для аплоада
      # (мы проксируем через /api/files/proxy-upload). Оставлен на случай если где-то
      # ещё понадобятся пресайны — указывает на внутренний docker-адрес.
      - MINIO_PUBLIC_URL=http://minio:9000
    restart: unless-stopped

  # Next.js фронт. Снаружи доступен через ngrok-туннель (см. eosinai-ngrok ниже).
  # Если когда-нибудь админ откроет порт наружу — раскомментируй ports.
  eosinai-frontend:
    build:
      context: ../frontend/my-app
      dockerfile: Dockerfile
    container_name: eosinai-frontend
    hostname: frontend
    expose:
      - "3000"
    # ports:
    #   - "3000:27"
    depends_on:
      - eosinai-server
    networks:
      - eosinai-net
    environment:
      - NODE_ENV=production
      # Внутри docker-сети Spring доступен по имени контейнера server.
      - BACKEND_URL=http://server:8080
    restart: unless-stopped

  # Cloudflare Tunnel — публичный URL без регистрации. Использует исходящий 443
  # на инфру Cloudflare (которую блокируют редко — это огромный CDN).
  # URL виден в логах: docker compose logs eosinai-cloudflared | grep trycloudflare
  eosinai-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eosinai-cloudflared
    hostname: cloudflared
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      - eosinai-frontend
    networks:
      - eosinai-net
    restart: unless-stopped

  # ngrok оставлен закомментированным — на этом сервере исходящий до ngrok заблокирован.
  # eosinai-ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: eosinai-ngrok
  #   command: ["http", "frontend:3000", "--log=stdout"]
  #   environment:
  #     - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
  #   depends_on:
  #     - eosinai-frontend
  #   networks:
  #     - eosinai-net
  #   restart: unless-stopped
