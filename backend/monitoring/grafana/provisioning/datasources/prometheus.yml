# Авто-подключение Prometheus как источника данных в Grafana.
# Подхватывается при старте контейнера grafana — заходишь в UI, datasource уже есть.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://eosinai-prometheus:9090
    isDefault: true
    editable: false
