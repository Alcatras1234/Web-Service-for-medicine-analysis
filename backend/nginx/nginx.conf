# Nginx reverse-proxy перед стэком EosinAI. ВСЁ снаружи — через единственный
# открытый порт 27. Path-based routing:
#   /              → eosinai-frontend (Next.js)  — фронт
#   /grafana/      → eosinai-grafana             — UI метрик
#   /prometheus/   → eosinai-prometheus          — UI запросов к метрикам
#
# network_mode: host даёт nginx прямой bind на host:27 (минуя сломанный docker-proxy).
# К контейнерам в eosinai-net2 ходим по их фикс-IP (10.27.0.0/16) — host-сеть не
# видит docker DNS, поэтому именами контейнеров пользоваться нельзя.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Большой WSI может литься десятки секунд — поднимаем лимиты.
    client_max_body_size      10G;
    client_body_buffer_size   1m;
    proxy_request_buffering   off;     # стримим upload без буферизации на диск
    proxy_read_timeout        30m;
    proxy_send_timeout        30m;
    proxy_connect_timeout     30s;

    # Docker bridge eosinai-net2 выдаёт контейнерам фикс-IP — см. docker-compose.yaml.
    upstream eosinai_frontend {
        server 10.27.0.10:27;          # Next.js слушает 27 внутри своего контейнера
    }
    upstream eosinai_grafana {
        server 10.27.0.30:3000;
    }
    upstream eosinai_prometheus {
        server 10.27.0.20:9090;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 27 default_server;
        server_name _;

        # WebSocket / SSE — нужны заголовки Upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ── Grafana под /grafana/  ─────────────────────────────────────────────
        # Grafana настроена через env GF_SERVER_ROOT_URL и GF_SERVER_SERVE_FROM_SUB_PATH
        # (см. docker-compose.yaml), поэтому относительные ссылки в её UI работают.
        location = /grafana    { return 301 /grafana/; }
        location = /prometheus { return 301 /prometheus/; }

        location /grafana/ {
            # rewrite режет /grafana — Grafana внутри считает базой /
            rewrite ^/grafana/(.*)$ /$1 break;
            proxy_pass http://eosinai_grafana;
        }
        # Лайв-фид (auto-refresh, live tail) — WebSocket
        location /grafana/api/live/ {
            rewrite ^/grafana/(.*)$ /$1 break;
            proxy_pass http://eosinai_grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # ── Prometheus под /prometheus/  ──────────────────────────────────────
        # Запускаем prometheus с --web.external-url=http://.../prometheus
        # — он сам корректно рендерит ассеты под этот префикс.
        location /prometheus/ {
            proxy_pass http://eosinai_prometheus/;   # обратите внимание на trailing slash
        }

        # ── Всё остальное — фронт ─────────────────────────────────────────────
        location / {
            proxy_pass http://eosinai_frontend;
        }
    }
}
