# Nginx reverse-proxy перед стэком EosinAI.
#
# Слушает host:27 НАПРЯМУЮ (контейнер с network_mode: host), минуя сломанный
# на этом сервере docker-proxy. Форвардит:
#   /         → eosinai-frontend (Next.js)
#   /api/*    → eosinai-server   (Spring Boot)  — если фронту не нужна обработка через свои route handlers
#
# В нашем случае Next.js сам проксирует /api/* в Spring (через route handlers c
# cookie → Bearer), так что nginx гонит ВСЁ в Next.js. Спринг доступен отдельно
# через свой публичный порт (18080) — для curl-тестов из консоли.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Большой WSI может литься десятки секунд — поднимаем лимиты.
    client_max_body_size      10G;
    client_body_buffer_size   1m;
    proxy_request_buffering   off;     # стримим upload без буферизации на диск
    proxy_read_timeout        30m;
    proxy_send_timeout        30m;
    proxy_connect_timeout     30s;

    # Docker bridge eosinai-net выдаёт контейнерам фикс-IP — см. docker-compose.yaml.
    upstream eosinai_frontend {
        server 172.28.0.10:27;         # Next.js слушает 27 внутри своего контейнера
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 27 default_server;
        server_name _;

        # WebSocket / SSE — нужны заголовки Upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        location / {
            proxy_pass http://eosinai_frontend;
        }
    }
}
